services:
  db:
    image: postgres:latest
    container_name: users_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - social-network

  user-service:
    build: ./user_service
    container_name: user_service
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://user:password@db/users_db
      SECRET_KEY: "123456"
    ports:
      - "8001:8000"
    networks:
      - social-network
    #command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]  
  # user_service_tests:
  #   build:
  #     context: ./user_service
  #     dockerfile: Dockerfile.test
  #   container_name: user_service_tests
  #   environment:
  #     - DATABASE_URL=postgresql://user:password@db/users_db
  #   depends_on:
  #     - db
  #   networks:
  #     - social-network    
  api-gateway:
    build: ./api_gateway
    container_name: api_gateway
    restart: always
    environment:
      PYTHONPATH: /app
      SECRET_KEY: "123456"
    depends_on:
      - user-service
      - post-service
    ports:
      - "5000:8080"
    volumes:
      - ./proto:/app/proto
    networks:
      - social-network
    #command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080"]

  post-service:
    build: ./post_service
    container_name: post-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://user:password@db/users_db
      - PYTHONPATH=/app
    depends_on:
      - db
    volumes:
      - ./proto:/app/proto
    ports:
      - "50051:50051"
    mem_limit: 512m
    #command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      - social-network      
    
networks:
  social-network:
    driver: bridge
volumes:
  postgres_data:
