syntax = "proto3";

package post;

import "google/protobuf/empty.proto";

service PostService {
  rpc CreatePost (CreatePostRequest) returns (PostResponse);
  rpc GetPost (GetPostRequest) returns (PostResponse);
  rpc UpdatePost (UpdatePostRequest) returns (PostResponse);
  rpc DeletePost (DeletePostRequest) returns (DeletePostResponse);
  rpc ListPosts (ListPostsRequest) returns (ListPostsResponse);
  rpc ViewPost(ViewPostRequest) returns (google.protobuf.Empty);
  rpc LikePost(LikePostRequest) returns (google.protobuf.Empty);
  rpc CommentPost(CommentPostRequest) returns (Comment);
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
}

message CreatePostRequest {
  string title = 1;
  string description = 2;
  string user_id = 3;
  bool is_private = 4;
  repeated string tags = 5;
}

message PostResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  string user_id = 4;
  string created_at = 5;
  string updated_at = 6;
  bool is_private = 7;
  repeated string tags = 8;
}

message GetPostRequest {
  string id = 1;
}

message UpdatePostRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  bool is_private = 4;
  repeated string tags = 5;
}

message DeletePostRequest {
  string id = 1;
}

message DeletePostResponse {
  bool success = 1;
}

message ListPostsRequest {
  int32 page = 1;
  int32 per_page = 2;
  string user_id = 3;
}

message ListPostsResponse {
  repeated PostResponse posts = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message ViewPostRequest {
  string post_id = 1;
  string user_id = 2;
}

message LikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message CommentPostRequest {
  string post_id = 1;
  string user_id = 2;
  string content = 3;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string user_id = 3;
  string content = 4;
  string created_at = 5;
}

message GetCommentsRequest {
  string post_id = 1;
  int32 page = 2;
  int32 per_page = 3;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}